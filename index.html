<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<meta name="description" content="在手機或電腦上拍攝、裁切並匯出文件掃描。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="文件掃描">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>文件掃描</title>
<style>
:root{color-scheme:light;--bg:#f5f6f8;--fg:#20242c;--card:#fff;--line:#e1e4e9;--pri:#315efb;--mut:#697386;--soft:#edf1ff;--shadow:0 12px 32px #20242c0a;box-sizing:border-box}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14171d;--fg:#edf0f5;--card:#1e222b;--line:#343a46;--pri:#7898ff;--mut:#a3adbd;--soft:#252e49;--shadow:0 12px 32px #0003}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif}
button,label.btn{min-height:44px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px 15px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .15s,border-color .15s}
button:hover,label.btn:hover{border-color:var(--pri)}
button:focus-visible,label.btn:focus-visible{outline:3px solid color-mix(in srgb,var(--pri) 40%,transparent);outline-offset:2px}
button.pri,label.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.on{border-color:var(--pri);color:var(--pri);background:var(--soft)}
button:disabled{opacity:.5;cursor:default}
main{max-width:980px;margin:0 auto;padding:24px 20px calc(40px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:42px;height:42px}
h1{font-size:21px;letter-spacing:.01em;margin:0}
.subtitle{color:var(--mut);font-size:13px;margin:2px 0 0}
.install{min-height:40px;padding:8px 12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.intro{max-width:560px;margin:8px auto 24px;text-align:center}
.intro h2{font-size:24px;margin:0 0 7px}
.intro p{color:var(--mut);margin:0}
.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
.divider{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:12px;margin:20px auto;max-width:420px}
.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 14px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.section-head h2{font-size:17px;margin:0}
#stage,#stage2{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;justify-content:center;min-height:160px;overflow:hidden}
canvas{max-width:100%;height:auto;display:block}
#edit{touch-action:none;cursor:crosshair}
#status{color:var(--mut);font-size:13px;margin:12px 2px 0;min-height:20px}
.hint{font-size:12px;color:var(--mut);margin:8px 2px 0}
.filter-row{display:flex;gap:7px;flex-wrap:wrap}
.filter-row button{min-height:40px;padding:8px 12px}
.result-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.result-top .bar{justify-content:flex-end}
.count{font-size:12px;color:var(--mut);font-weight:500;white-space:nowrap}
.pages{display:flex;gap:10px;overflow-x:auto;padding:2px 1px 8px}
.page-card{position:relative;flex:0 0 82px;height:100px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:5px}
.page-card canvas{width:100%;height:100%;object-fit:contain}
.page-no{position:absolute;left:5px;bottom:5px;background:#20242cbb;color:white;padding:1px 6px;border-radius:20px;font-size:11px}
.hide{display:none!important}
.error{color:#c0392b!important}
@media(max-width:600px){main{padding:16px 14px calc(28px + env(safe-area-inset-bottom))}header{margin-bottom:20px}.panel{padding:16px;border-radius:16px}.intro h2{font-size:21px}.bar{gap:7px}button,label.btn{padding:9px 11px}.result-top{display:block}.result-top .bar{justify-content:flex-start}}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14171d;--fg:#edf0f5;--card:#1e222b;--line:#343a46;--pri:#7898ff;--mut:#a3adbd;--soft:#252e49;--shadow:0 12px 32px #0003}}
</style>
</head>
<body>
<main>
  <header>
    <div class="brand"><img src="./icon.svg" alt=""><div><h1>文件掃描</h1><p class="subtitle">拍攝、拉正並整理成 PDF</p></div></div>
    <button id="install" class="install hide" type="button">安裝 App</button>
  </header>

  <section id="homeView" class="panel">
    <div class="intro"><h2>把紙本變成清晰的數位文件</h2><p>圖片會在此裝置上處理；匯出 PDF 後即可保存文件。</p></div>
    <div class="actions">
      <label class="btn pri">選擇圖片<input id="file" type="file" accept="image/*" hidden></label>
      <label class="btn">拍攝文件<input id="cam" type="file" accept="image/*" capture="environment" hidden></label>
    </div>
    <div class="divider">多頁文件</div>
    <div id="pages" class="pages" aria-label="文件頁面"></div>
    <p class="hint">頁面只會暫存在目前工作階段，匯出 PDF 後請保存檔案。</p>
    <div class="actions">
      <button id="savePdf" type="button" disabled>匯出 PDF（0 頁）</button>
      <button id="clearPages" type="button" disabled>清除文件</button>
    </div>
  </section>

  <section id="editView" class="panel hide">
    <div class="section-head"><h2>調整文件範圍</h2><span class="count">拖曳四角以校正</span></div>
    <div class="bar">
      <button id="btnReplaceEdit" type="button">重新選照片</button>
      <button id="btnDetect" type="button">重新偵測</button>
      <button id="btnReset" type="button">重設四角</button>
      <button id="btnWarp" class="pri" type="button">拉正文件</button>
    </div>
    <div id="stage"><canvas id="edit"></canvas></div>
    <p class="hint">如果沒有偵測到文件邊緣，請手動拖曳藍色四角。</p>
  </section>

  <section id="resView" class="panel hide">
    <div class="result-top">
      <div class="section-head"><h2>掃描結果</h2></div>
      <div class="bar">
        <button id="btnBack" type="button">調整四角</button>
        <button id="btnReplaceResult" type="button">重新選照片</button>
        <button id="btnAddPage" type="button">加入 PDF 並掃下一張</button>
        <button id="btnNext" class="pri" type="button">下載 JPG 並掃描下一張</button>
      </div>
    </div>
    <div class="bar filter-row" aria-label="影像濾鏡">
      <button data-f="orig" class="flt" type="button">原色</button>
      <button data-f="enh" class="flt" type="button">增強</button>
      <button data-f="gray" class="flt" type="button">灰階</button>
      <button data-f="scan" class="flt" type="button" title="校正紙面亮度與陰影，白底黑字，保留灰階層次">掃描</button>
      <button data-f="form" class="flt" type="button" title="有固定印刷色的表單（估價單等）：淡化紅/橙/黃/綠印刷色，突顯藍/黑手寫">表單</button>
      <button data-f="bw" class="flt" type="button" title="先校正紙面亮度，再依局部對比轉成黑白">黑白</button>
      <label id="scanLevelWrap" style="display:inline-flex;align-items:center;gap:6px;font-size:13px">濃淡
        <input id="scanLevel" type="range" min="90" max="160" value="120" style="width:110px"></label>
      <span id="formWrap" style="display:none;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px">
        <label style="display:inline-flex;align-items:center;gap:6px" title="越高，紅/橙/黃/綠色的印刷線條與底色越淡">表單色淡化 <input id="formFade" type="range" min="0" max="100" value="90" style="width:100px"></label>
        <label style="display:inline-flex;align-items:center;gap:6px" title="越高，黑色印刷字越淡，藍/藍紫色手寫越突出">筆跡強調 <input id="formEmph" type="range" min="0" max="100" value="0" style="width:100px"></label>
      </span>
      <button id="btnRot" type="button">旋轉 90°</button>
      <button id="btnSave" type="button">下載 JPG</button>
    </div>
    <div id="stage2"><canvas id="out"></canvas></div>
  </section>
  <p id="status" role="status" aria-live="polite">正在載入掃描引擎…</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.9.0-release.1/dist/opencv.js" crossorigin="anonymous"></script>
<script>
const $ = id => document.getElementById(id);
const status = (text, error = false) => { $('status').textContent = text; $('status').classList.toggle('error', error); };
let cvReady = false, src = null, pts = [], S = 1, drag = -1;
const FILTERS = ['orig','enh','gray','scan','form','bw'];
function pref(key, fallback) { try { const v = localStorage.getItem('docscan.' + key); return v === null ? fallback : v; } catch (error) { return fallback; } }
function setPref(key, value) { try { localStorage.setItem('docscan.' + key, String(value)); } catch (error) {} }
function savedFilter() { const f = pref('filter', 'scan'); return FILTERS.includes(f) ? f : 'scan'; }
let warped = null, filter = savedFilter(), rot = 0, pages = [];

function ready() {
  if (cvReady) return;
  cvReady = true;
  status(src ? '掃描引擎就緒，正在偵測文件…' : '掃描引擎就緒，請選擇圖片或拍攝文件。');
  if (src) detect(true);
}
if (window.cv instanceof Promise) window.cv.then(m => { window.cv = m; ready(); }).catch(() => status('掃描引擎載入失敗，請重新整理並確認網路連線。', true));
else if (window.cv && window.cv.Mat) ready();
else if (window.cv) {
  window.cv.onRuntimeInitialized = ready;
  const poll = setInterval(() => { if (cvReady) clearInterval(poll); else if (window.cv && window.cv.Mat) { clearInterval(poll); ready(); } }, 300);
}
else status('掃描引擎載入失敗，請確認網路連線後重新整理。', true);

async function load(file) {
  if (!file) return;
  try {
    if (!file.type.startsWith('image/')) throw new Error('請選擇圖片檔案。');
    const bmp = await createImageBitmap(file, {imageOrientation:'from-image'});
    const k = Math.min(1, 3000 / Math.max(bmp.width, bmp.height));
    const next = document.createElement('canvas');
    next.width = Math.max(1, Math.round(bmp.width * k));
    next.height = Math.max(1, Math.round(bmp.height * k));
    const context = next.getContext('2d');
    if (!context) throw new Error('無法建立圖片處理畫布。');
    context.drawImage(bmp, 0, 0, next.width, next.height);
    bmp.close();
    src = next;
    $('homeView').classList.add('hide');
    $('resView').classList.add('hide');
    $('editView').classList.remove('hide');
    resetPts(); layout();
    if (cvReady) detect(true); else status('圖片已載入，等待掃描引擎…');
  } catch (error) {
    status(error.message || '圖片讀取失敗，請換一張圖片再試。', true);
  } finally {
    $('file').value = '';
    $('cam').value = '';
  }
}
$('file').addEventListener('change', e => load(e.target.files[0]));
$('cam').addEventListener('change', e => load(e.target.files[0]));

function resetPts() {
  const m = .05, w = src.width, h = src.height;
  pts = [[w*m,h*m],[w*(1-m),h*m],[w*(1-m),h*(1-m)],[w*m,h*(1-m)]];
}
function layout() {
  if (!src) return;
  const c = $('edit'), dpr = window.devicePixelRatio || 1;
  const maxW = Math.max(1, $('stage').clientWidth - 20), maxH = innerHeight * .62;
  const s = Math.min(maxW / src.width, maxH / src.height, 1);
  const cssW = src.width * s, cssH = src.height * s;
  c.style.width = cssW + 'px'; c.style.height = cssH + 'px';
  c.width = Math.round(cssW * dpr); c.height = Math.round(cssH * dpr);
  S = c.width / src.width; draw();
}
function draw() {
  if (!src) return;
  const c = $('edit'), g = c.getContext('2d');
  g.drawImage(src, 0, 0, c.width, c.height);
  const p = pts.map(q => [q[0]*S, q[1]*S]), r = 14 * (devicePixelRatio || 1);
  g.beginPath(); g.moveTo(p[0][0], p[0][1]); p.slice(1).forEach(q => g.lineTo(q[0], q[1])); g.closePath();
  g.fillStyle = 'rgba(49,94,251,.18)'; g.fill();
  g.lineWidth = 2 * (devicePixelRatio || 1); g.strokeStyle = '#315efb'; g.stroke();
  p.forEach(q => { g.beginPath(); g.arc(q[0], q[1], r, 0, Math.PI*2); g.fillStyle = '#fff'; g.fill(); g.stroke(); });
  if (drag >= 0) drawLoupe(g, c, p[drag]);
}
// 拖曳時在畫面角落顯示 3 倍放大鏡（放在手指另一側，避免被擋住）
function drawLoupe(g, c, pt) {
  const dpr = window.devicePixelRatio || 1, L = 104 * dpr, z = 3, m = 8 * dpr;
  const lx = pt[0] < c.width / 2 ? c.width - L - m : m, ly = m;
  const [px, py] = pts[drag], side = L / (S * z);
  g.save();
  g.beginPath(); g.arc(lx + L/2, ly + L/2, L/2, 0, Math.PI*2); g.clip();
  g.fillStyle = '#fff'; g.fillRect(lx, ly, L, L);
  g.drawImage(src, px - side/2, py - side/2, side, side, lx, ly, L, L);
  g.restore();
  g.lineWidth = 2 * dpr; g.strokeStyle = '#315efb';
  g.beginPath(); g.arc(lx + L/2, ly + L/2, L/2, 0, Math.PI*2); g.stroke();
  g.strokeStyle = '#e5322d'; g.lineWidth = dpr;
  g.beginPath(); g.moveTo(lx + L/2 - 10*dpr, ly + L/2); g.lineTo(lx + L/2 + 10*dpr, ly + L/2);
  g.moveTo(lx + L/2, ly + L/2 - 10*dpr); g.lineTo(lx + L/2, ly + L/2 + 10*dpr); g.stroke();
}
function evPos(e) {
  const c = $('edit'), b = c.getBoundingClientRect(), k = c.width / b.width;
  return [(e.clientX - b.left) * k / S, (e.clientY - b.top) * k / S];
}
$('edit').addEventListener('pointerdown', e => {
  if (!src) return;
  const [x,y] = evPos(e); let best = -1, bd = (36*(devicePixelRatio||1)/S)**2;
  pts.forEach((q,i) => { const d = (q[0]-x)**2+(q[1]-y)**2; if (d < bd) { bd=d; best=i; } });
  drag=best;
  if (best >= 0) { e.target.setPointerCapture(e.pointerId); draw(); }
});
$('edit').addEventListener('pointermove', e => {
  if (drag < 0) return;
  const [x,y] = evPos(e);
  pts[drag] = [Math.max(0,Math.min(src.width,x)),Math.max(0,Math.min(src.height,y))];
  draw();
});
['pointerup','pointercancel','lostpointercapture'].forEach(t => $('edit').addEventListener(t, () => { if (drag >= 0) { drag=-1; draw(); } }));
addEventListener('resize', () => { if (src && !$('editView').classList.contains('hide')) layout(); });

function orderPts(a) {
  const center=a.reduce((sum,p)=>[sum[0]+p[0]/a.length,sum[1]+p[1]/a.length],[0,0]);
  const ordered=[...a].sort((p,q)=>Math.atan2(p[1]-center[1],p[0]-center[0])-Math.atan2(q[1]-center[1],q[0]-center[0]));
  const first=ordered.reduce((best,p,index)=>p[0]+p[1]<ordered[best][0]+ordered[best][1]?index:best,0);
  return ordered.slice(first).concat(ordered.slice(0,first));
}
// 前景分割找文件：假設文件在畫面中央、背景（桌面）佔外圍。GrabCut 以內縮矩形初始化，
// 不依賴邊緣線是否連續，所以文件內有圖案/文字、或紙色與桌面接近時也能抓到整張。
function grabCutQuad(rgba) {
  const tmps = [];
  const mk = (x) => { x = x || new cv.Mat(); tmps.push(x); return x; };
  try {
    const k = Math.min(1, 320 / Math.max(rgba.cols, rgba.rows));
    const w = Math.max(16, Math.round(rgba.cols * k)), h = Math.max(16, Math.round(rgba.rows * k));
    const rgb = mk(); cv.cvtColor(rgba, rgb, cv.COLOR_RGBA2RGB);
    const small = mk(); cv.resize(rgb, small, new cv.Size(w, h), 0, 0, cv.INTER_AREA);
    const mask = mk(new cv.Mat(h, w, cv.CV_8UC1, new cv.Scalar(0)));
    const bgd = mk(), fgd = mk();
    const ix = Math.round(w * 0.03), iy = Math.round(h * 0.03);
    cv.grabCut(small, mask, new cv.Rect(ix, iy, w - 2 * ix, h - 2 * iy), bgd, fgd, 4, cv.GC_INIT_WITH_RECT);
    const fg = mk(new cv.Mat(h, w, cv.CV_8UC1, new cv.Scalar(0)));
    let count = 0;
    for (let i = 0; i < mask.data.length; i++) { const v = mask.data[i]; if (v === 1 || v === 3) { fg.data[i] = 255; count++; } }
    const ratio = count / (w * h);
    if (ratio < 0.08 || ratio > 0.95) return null;           // 分割失敗（太小或幾乎整張都是前景）
    const open = mk(cv.Mat.ones(3, 3, cv.CV_8U));
    cv.morphologyEx(fg, fg, cv.MORPH_OPEN, open);
    const cs = new cv.MatVector(), hier = mk(); tmps.push({ delete: () => cs.delete() });
    cv.findContours(fg, cs, hier, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
    let best = -1, bestA = 0;
    for (let i = 0; i < cs.size(); i++) { const c = cs.get(i), a = cv.contourArea(c); c.delete(); if (a > bestA) { bestA = a; best = i; } }
    if (best < 0 || bestA < 0.08 * w * h) return null;
    const big = cs.get(best), hull = mk(); cv.convexHull(big, hull, false, true); big.delete();
    const hullA = cv.contourArea(hull), per = cv.arcLength(hull, true);
    let quad = null;
    for (let eps = 0.01; eps < 0.12; eps += 0.005) {            // 逐步放寬，找可近似成 4 點（保留透視）的凸包
      const ap = new cv.Mat(); cv.approxPolyDP(hull, ap, eps * per, true);
      const n = ap.rows, a = n === 4 ? cv.contourArea(ap) : 0;
      if (n === 4 && a >= 0.9 * hullA) quad = [0, 1, 2, 3].map(j => [ap.data32S[j * 2], ap.data32S[j * 2 + 1]]);
      ap.delete(); if (n <= 4) break;
    }
    if (!quad) {                                                // 退而求其次：最小外接旋轉矩形
      const rr = cv.minAreaRect(hull), pp = cv.RotatedRect.points(rr);
      quad = pp.map(p => [p.x, p.y]);
    }
    return quad.map(p => [p[0] / k, p[1] / k]);                 // 回到輸入圖座標
  } finally { tmps.forEach(x => x.delete()); }
}

// 以「第一次四角範圍內的主要底色」重新評估四角：在附近找同色區域、補洞、再取四角。
// 只有在範圍內大多是單一底色（估價單、白紙…）時才採用；傳單、多色封面等維持原判斷。
function refineQuadByColor(rgba, quad0) {
  let quad = quad0, ref = null;
  const a0 = polyArea(quad0);
  for (let pass = 0; pass < 3; pass++) {                 // 小範圍最多分 3 次長大，面積變化 < 2% 就停
    const r = refineOnce(rgba, quad, ref);
    if (!r) break;
    ref = r.ref;                                         // 參考底色只在第一次（用原始四角內部）決定，之後沿用，避免越長越偏向桌面顏色
    const a1 = polyArea(r.quad), growth = a1 / a0;
    if (growth < 0.7 || growth > 1.8) break;             // 相對原始四角變動過大 → 停止
    const done = Math.abs(a1 - polyArea(quad)) / polyArea(quad) < 0.02;
    quad = r.quad;
    if (done) break;
  }
  return quad;
}
function polyArea(p) { let s = 0; for (let i = 0; i < p.length; i++) { const q = p[(i + 1) % p.length]; s += p[i][0] * q[1] - q[0] * p[i][1]; } return Math.abs(s) / 2; }

function refineOnce(rgba, q0, ref0) {
  const tmps = [];
  const keep = x => { tmps.push(x); return x; };
  const mk = () => keep(new cv.Mat());
  const odd = v => (Math.max(3, Math.round(v)) | 1);
  try {
    const k = Math.min(1, 400 / Math.max(rgba.cols, rgba.rows));
    const w = Math.max(16, Math.round(rgba.cols * k)), h = Math.max(16, Math.round(rgba.rows * k)), side = Math.min(w, h);
    const rgb = mk(); cv.cvtColor(rgba, rgb, cv.COLOR_RGBA2RGB);
    const small = mk(); cv.resize(rgb, small, new cv.Size(w, h), 0, 0, cv.INTER_AREA);
    cv.GaussianBlur(small, small, new cv.Size(0, 0), 1.2);
    const lab = mk(); cv.cvtColor(small, lab, cv.COLOR_RGB2Lab);
    // 第一次四角 → 遮罩
    const quad = keep(cv.Mat.zeros(h, w, cv.CV_8UC1));
    const pts = keep(cv.matFromArray(q0.length, 1, cv.CV_32SC2, q0.flatMap(p => [Math.round(p[0] * k), Math.round(p[1] * k)])));
    cv.fillConvexPoly(quad, pts, new cv.Scalar(255));
    const qa = cv.countNonZero(quad);
    if (qa < 400) return null;
    const big = keep(cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(odd(side * 0.2), odd(side * 0.2))));
    const inner = mk(); cv.erode(quad, inner, big);
    const useInner = cv.countNonZero(inner) >= 200 ? inner : quad;
    const L = lab.data, n = w * h;
    let med, thr, purity = 1;
    const dist = i => { const dl = (L[i*3] - med[0]) * 0.25, da = L[i*3+1] - med[1], db = L[i*3+2] - med[2]; return Math.sqrt(dl*dl + da*da + db*db); };
    if (ref0) { med = ref0.med; thr = ref0.thr; }
    else {
      // 內部像素的中位數顏色（直方圖法）
      const cnt = [new Uint32Array(256), new Uint32Array(256), new Uint32Array(256)];
      let m = 0;
      for (let i = 0; i < n; i++) if (useInner.data[i]) { m++; cnt[0][L[i*3]]++; cnt[1][L[i*3+1]]++; cnt[2][L[i*3+2]]++; }
      med = cnt.map(c => { let s = 0; for (let v = 0; v < 256; v++) { s += c[v]; if (s >= m / 2) return v; } return 128; });
      const din = new Float32Array(m); let j = 0;
      for (let i = 0; i < n; i++) if (useInner.data[i]) din[j++] = dist(i);
      const sorted = Float32Array.from(din).sort();
      thr = Math.min(24, Math.max(8, 2.0 * sorted[m >> 1] + 3));
      let ok = 0; for (let i = 0; i < m; i++) if (din[i] < thr) ok++;
      purity = ok / m;
      if (thr > 15 || purity < 0.72) return null;          // 內部顏色離散（多色/漸層/深淺不一）→ 不是單一底色，不調整
    }
    // 在第一次結果附近找同色像素
    const near = mk(); cv.dilate(quad, near, big);
    const mask = keep(cv.Mat.zeros(h, w, cv.CV_8UC1));
    for (let i = 0; i < n; i++) if (near.data[i] && dist(i) < thr) mask.data[i] = 255;
    const kc = keep(cv.getStructuringElement(cv.MORPH_ELLIPSE, new cv.Size(odd(side * 0.035), odd(side * 0.035))));
    const ko = keep(cv.getStructuringElement(cv.MORPH_ELLIPSE, new cv.Size(odd(side * 0.04), odd(side * 0.04))));
    cv.morphologyEx(mask, mask, cv.MORPH_CLOSE, kc);       // 連起被印刷線/手寫切開的紙面
    cv.morphologyEx(mask, mask, cv.MORPH_OPEN, ko);        // 去掉細長外溢（疊在底下的複寫聯邊緣）
    const cs = new cv.MatVector(); keep({ delete: () => cs.delete() });
    const hier = mk(); cv.findContours(mask, cs, hier, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
    let bi = -1, ba = 0;
    for (let i = 0; i < cs.size(); i++) { const c = cs.get(i), a = cv.contourArea(c); c.delete(); if (a > ba) { ba = a; bi = i; } }
    if (bi < 0) return null;
    const filled = keep(cv.Mat.zeros(h, w, cv.CV_8UC1));
    const bc = cs.get(bi), one = keep(new cv.MatVector()); one.push_back(bc);
    cv.drawContours(filled, one, 0, new cv.Scalar(255), -1);
    const fa = cv.countNonZero(filled), ratio = fa / qa;
    if (!(ratio > 0.5 && ratio < 1.7) || ratio < (ref0 || purity >= 0.85 ? 0.75 : 0.92)) { bc.delete(); return null; }   // 變動過大 → 不採用
    const hull = mk(); cv.convexHull(bc, hull, false, true); bc.delete();
    const hullA = cv.contourArea(hull), per = cv.arcLength(hull, true);
    let res = null;
    for (let eps = 0.01; eps < 0.12; eps += 0.005) {
      const ap = new cv.Mat(); cv.approxPolyDP(hull, ap, eps * per, true);
      const rows = ap.rows, a = rows === 4 ? cv.contourArea(ap) : 0;
      if (rows === 4 && a >= 0.9 * hullA) res = [0, 1, 2, 3].map(t => [ap.data32S[t*2], ap.data32S[t*2+1]]);
      ap.delete(); if (rows <= 4) break;
    }
    if (!res) return null;                                  // 無法近似成四邊形（頁面彎曲/外溢）→ 不採用，維持原判斷
    return { quad: res.map(p => [p[0] / k, p[1] / k]), ref: { med, thr } };
  } finally { tmps.forEach(x => x.delete()); }
}

function detect(autoWarp = false) {
  if (!cvReady || !src) return false;
  status('正在偵測文件邊緣…');
  const k = 600 / Math.max(src.width,src.height), t = document.createElement('canvas');
  t.width=Math.max(1,Math.round(src.width*k)); t.height=Math.max(1,Math.round(src.height*k));
  t.getContext('2d').drawImage(src,0,0,t.width,t.height);
  let m,gray,edges,kern,cs,hier,rgb,hsv,mask,lower,upper,colorCs,colorHier;
  let found=null,foundArea=0,detectionError=false;
  try {
    m=cv.imread(t); gray=new cv.Mat(); edges=new cv.Mat(); kern=cv.Mat.ones(5,5,cv.CV_8U); cs=new cv.MatVector(); hier=new cv.Mat();
    let gq=null;
    try { gq=grabCutQuad(m); } catch(error) { console.warn('GrabCut 偵測失敗，改用邊緣法', error); }
    if(gq){ try { gq=refineQuadByColor(m,gq); } catch(error) { console.warn('底色修正失敗，沿用 GrabCut 結果', error); } }   // 用範圍內的主要底色再評估四角
    if(gq){ found=gq.map(p=>[p[0]/k,p[1]/k]); foundArea=1; } else {   // 主要：前景分割；失敗才走下面的邊緣/顏色備援
    cv.cvtColor(m,gray,cv.COLOR_RGBA2GRAY); cv.GaussianBlur(gray,gray,new cv.Size(5,5),0);
    cv.Canny(gray,edges,50,150); cv.morphologyEx(edges,edges,cv.MORPH_CLOSE,kern);
    cv.findContours(edges,cs,hier,cv.RETR_LIST,cv.CHAIN_APPROX_SIMPLE);
    let maxA=.1*t.width*t.height;
    for(let i=0;i<cs.size();i++){
      const c=cs.get(i), ap=new cv.Mat();
      try {
        const perimeter=cv.arcLength(c,true);
        for(const epsilon of [.02,.025,.03]){
          cv.approxPolyDP(c,ap,epsilon*perimeter,true);
          const area=cv.contourArea(ap);
          if(ap.rows===4&&area>maxA&&cv.isContourConvex(ap)){
            maxA=area;foundArea=area;found=[0,1,2,3].map(j=>[ap.data32S[j*2]/k,ap.data32S[j*2+1]/k]);
          }
        }
      } finally { ap.delete(); c.delete(); }
    }
    rgb=new cv.Mat();hsv=new cv.Mat();mask=new cv.Mat();
    cv.cvtColor(m,rgb,cv.COLOR_RGBA2RGB);cv.cvtColor(rgb,hsv,cv.COLOR_RGB2HSV);
    lower=new cv.Mat(t.height,t.width,cv.CV_8UC3);upper=new cv.Mat(t.height,t.width,cv.CV_8UC3);
    lower.setTo(new cv.Scalar(30,0,70,0));upper.setTo(new cv.Scalar(80,110,255,255));
    cv.inRange(hsv,lower,upper,mask);
    colorCs=new cv.MatVector();colorHier=new cv.Mat();
    cv.findContours(mask,colorCs,colorHier,cv.RETR_EXTERNAL,cv.CHAIN_APPROX_SIMPLE);
    for(let i=0;i<colorCs.size();i++){
      const c=colorCs.get(i),ap=new cv.Mat();
      try{
        const perimeter=cv.arcLength(c,true);
        for(const epsilon of [.02,.025,.03]){
          cv.approxPolyDP(c,ap,epsilon*perimeter,true);
          const area=cv.contourArea(ap);
          if(ap.rows!==4||!cv.isContourConvex(ap)||area<.12*t.width*t.height||area>.92*t.width*t.height)continue;
          const quad=Array.from({length:4},(_,j)=>[ap.data32S[j*2],ap.data32S[j*2+1]]);
          const ordered=orderPts(quad);
          const width=Math.max(dist(ordered[0],ordered[1]),dist(ordered[2],ordered[3]));
          const height=Math.max(dist(ordered[0],ordered[3]),dist(ordered[1],ordered[2]));
          if(width/height<.35||width/height>1.8||area<=foundArea*1.1)continue;
          foundArea=area;found=quad.map(point=>[point[0]/k,point[1]/k]);
        }
      }finally{ap.delete();c.delete();}
    }
    }
  } catch(error) {
    detectionError=true;
  } finally {
    [m,gray,edges,kern,cs,hier,rgb,hsv,mask,lower,upper,colorCs,colorHier].forEach(value => { if(value) value.delete(); });
  }
  if(found){
    pts=orderPts(found);
    if(autoWarp) warp();
    else status('已偵測到文件，可拖曳四角微調。');
    draw();
    return true;
  }
  resetPts();
  status(detectionError?'文件偵測發生錯誤，請手動調整四角。':'未偵測到明確文件邊緣，請手動調整四角。',detectionError);
  draw();
  return false;
}
$('btnDetect').addEventListener('click',()=>detect());
$('btnReset').addEventListener('click',()=>{resetPts();draw();});

const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function warp() {
  if(!cvReady){status('掃描引擎尚未就緒。',true);return;}
  const [tl,tr,br,bl]=orderPts(pts);
  const w=Math.round(Math.max(dist(tl,tr),dist(bl,br))),h=Math.round(Math.max(dist(tl,bl),dist(tr,br)));
  if(w<20||h<20){status('四角範圍太小，請重新調整。',true);return;}
  let m,dst,a,b,M;
  try {
    m=cv.imread(src);dst=new cv.Mat();
    a=cv.matFromArray(4,1,cv.CV_32FC2,[tl,tr,br,bl].flat());
    b=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,w,0,w,h,0,h]);
    M=cv.getPerspectiveTransform(a,b);
    cv.warpPerspective(m,dst,M,new cv.Size(w,h),cv.INTER_LINEAR,cv.BORDER_CONSTANT,new cv.Scalar(255,255,255,255));
    warped=document.createElement('canvas');cv.imshow(warped,dst);
  } catch(error) {
    status('拉正失敗，請調整四角後再試。',true);
    return;
  } finally {
    [m,dst,a,b,M].forEach(value=>{if(value)value.delete();});
  }
  rot=0;filter=savedFilter();
  document.querySelectorAll('.flt').forEach(x=>x.classList.toggle('on',x.dataset.f===filter));
  $('editView').classList.add('hide');$('homeView').classList.add('hide');$('resView').classList.remove('hide');
  render();status(`拉正完成：${w} × ${h} px`);
}

// 掃描濾鏡：估計紙面背景 → 相除消除陰影/底色 → 色階拉開 → 輕微銳化
function scanFilter(g, lo) {
  const hi = lo + 80, gamma = 1.2, sharpen = 0.6;
  const tmps = [];
  const mk = () => { const x = new cv.Mat(); tmps.push(x); return x; };
  try {
    const k = Math.min(1, 800 / Math.max(g.cols, g.rows));
    const small = mk();
    cv.resize(g, small, new cv.Size(Math.max(1, Math.round(g.cols * k)), Math.max(1, Math.round(g.rows * k))), 0, 0, cv.INTER_AREA);
    const ks = Math.max(9, Math.floor(Math.min(small.cols, small.rows) / 22)) | 1;
    const el = cv.getStructuringElement(cv.MORPH_ELLIPSE, new cv.Size(ks, ks)); tmps.push(el);
    cv.dilate(small, small, el);                       // 去掉文字，只留紙面亮度
    cv.medianBlur(small, small, Math.min(ks, 255) | 1);
    cv.GaussianBlur(small, small, new cv.Size(0, 0), ks / 2);
    const bg = mk(); cv.resize(small, bg, new cv.Size(g.cols, g.rows), 0, 0, cv.INTER_LINEAR);
    const nrm = mk(); cv.divide(g, bg, nrm, 255, cv.CV_8U);   // 紙面 → 白
    const arr = new Uint8Array(256);
    for (let i = 0; i < 256; i++) arr[i] = Math.round(255 * Math.pow(Math.min(1, Math.max(0, (i - lo) / (hi - lo))), gamma));
    const lut = cv.matFromArray(1, 256, cv.CV_8U, Array.from(arr)); tmps.push(lut);
    const lev = mk(); cv.LUT(nrm, lut, lev);
    const blur = mk(); cv.GaussianBlur(lev, blur, new cv.Size(0, 0), 1.2);
    const out = new cv.Mat(); cv.addWeighted(lev, 1 + sharpen, blur, -sharpen, 0, out);
    return out;
  } finally { tmps.forEach(x => x.delete()); }
}

// 表單濾鏡：針對有固定印刷色（紅/橙/黃/綠/粉紅）的估價單，淡化表單色、保留藍/黑色手寫筆跡
function formFilter(rgba, lo, fade, emph) {
  const tmps = [];
  const keep = x => { tmps.push(x); return x; };
  const mk = () => keep(new cv.Mat());
  const sat = (x, a, b) => x <= a ? 0 : x >= b ? 1 : (x - a) / (b - a);
  let out = null;
  try {
    const rgb = mk(); cv.cvtColor(rgba, rgb, cv.COLOR_RGBA2RGB);
    // 1) 各色頻分別估計紙面背景再相除：紙色（黃/粉紅）變白，印刷色與墨水保留相對顏色
    const k = Math.min(1, 800 / Math.max(rgb.cols, rgb.rows));
    const small = mk();
    cv.resize(rgb, small, new cv.Size(Math.max(1, Math.round(rgb.cols * k)), Math.max(1, Math.round(rgb.rows * k))), 0, 0, cv.INTER_AREA);
    const ks = Math.max(9, Math.floor(Math.min(small.cols, small.rows) / 22)) | 1;
    const el = keep(cv.getStructuringElement(cv.MORPH_ELLIPSE, new cv.Size(ks, ks)));
    cv.dilate(small, small, el);
    cv.medianBlur(small, small, Math.min(ks, 255) | 1);
    cv.GaussianBlur(small, small, new cv.Size(0, 0), ks / 2);
    const bg = mk(); cv.resize(small, bg, new cv.Size(rgb.cols, rgb.rows), 0, 0, cv.INTER_LINEAR);
    const flat = mk(); cv.divide(rgb, bg, flat, 255, cv.CV_8U);
    // 2) 灰階 = 一般亮度 與 max(R,G) 的混合：紅/橙/黃/綠/粉紅變亮，藍/深藍/黑維持深色
    const mv = keep(new cv.MatVector()); cv.split(flat, mv);
    const R = keep(mv.get(0)), G = keep(mv.get(1));
    const drop = mk(); cv.max(R, G, drop);
    const luma = mk(); cv.cvtColor(flat, luma, cv.COLOR_RGB2GRAY);
    const gray = mk(); cv.addWeighted(luma, 1 - fade, drop, fade, 0, gray);
    // 3) 色階拉開 + 輕微銳化（與「掃描」相同）
    const hi = lo + 80, arr = new Array(256);
    for (let i = 0; i < 256; i++) arr[i] = Math.round(255 * Math.pow(sat(i, lo, hi), 1.2));
    const lut = keep(cv.matFromArray(1, 256, cv.CV_8U, arr));
    const lev = mk(); cv.LUT(gray, lut, lev);
    const blur = mk(); cv.GaussianBlur(lev, blur, new cv.Size(0, 0), 1.2);
    out = new cv.Mat(); cv.addWeighted(lev, 1.6, blur, -0.6, 0, out);
    // 4) 筆跡強調：藍/藍紫色（原子筆）以外的深色（印刷黑字、黑線）稍微淡化，讓手寫更突出
    if (emph > 0) {
      const lab = mk(); cv.cvtColor(flat, lab, cv.COLOR_RGB2Lab);
      const lv = keep(new cv.MatVector()); cv.split(lab, lv);
      const A = keep(lv.get(1)), Bc = keep(lv.get(2));
      cv.GaussianBlur(A, A, new cv.Size(0, 0), 0.8); cv.GaussianBlur(Bc, Bc, new cv.Size(0, 0), 0.8);
      const ink = keep(new cv.Mat(out.rows, out.cols, cv.CV_8UC1, new cv.Scalar(0)));
      for (let i = 0; i < ink.data.length; i++) {
        const a = A.data[i] - 128, b = Bc.data[i] - 128, c2 = a * a + b * b;
        if (c2 < 144) continue;                                         // 彩度 < 12：中性色，不是藍筆
        const C = Math.sqrt(c2), hue = Math.atan2(b, a) * 180 / Math.PI;               // 藍~藍紫約 -40°~-130°
        ink.data[i] = Math.round(255 * sat(C, 12, 20) * sat(-hue, 35, 50) * (1 - sat(-hue, 130, 150)));
      }
      cv.dilate(ink, ink, keep(cv.Mat.ones(3, 3, cv.CV_8U)));        // 細筆畫彩度偏低，稍微擴張
      for (let i = 0; i < out.data.length; i++) {
        const v = out.data[i];
        if (v >= 240) continue;                                         // 已是白底，不需處理
        out.data[i] = v + (255 - v) * 0.5 * emph * (1 - ink.data[i] / 255) * (1 - sat(v, 200, 240));
      }
    }
    return out;
  } catch (error) {
    if (out) out.delete();
    throw error;
  } finally { tmps.forEach(x => x.delete()); }
}

function render() {
  if(!warped)return;
  $('scanLevelWrap').style.display=(filter==='scan'||filter==='form')?'inline-flex':'none';
  $('formWrap').style.display=filter==='form'?'inline-flex':'none';
  let m,o,g,channels,hsv,rgb;
  try {
    m=cv.imread(warped);o=new cv.Mat();g=new cv.Mat();
    if(filter==='orig')m.copyTo(o);
    else if(filter==='enh'){
      rgb=new cv.Mat();hsv=new cv.Mat();channels=new cv.MatVector();
      cv.cvtColor(m,rgb,cv.COLOR_RGBA2RGB);cv.cvtColor(rgb,hsv,cv.COLOR_RGB2HSV);cv.split(hsv,channels);
      const value=channels.get(2);
      cv.equalizeHist(value,value);channels.set(2,value);value.delete();
      cv.merge(channels,hsv);
      cv.cvtColor(hsv,rgb,cv.COLOR_HSV2RGB);cv.cvtColor(rgb,o,cv.COLOR_RGB2RGBA);
    }
    else if(filter==='scan'){
      cv.cvtColor(m,g,cv.COLOR_RGBA2GRAY);
      const s=scanFilter(g,Number($('scanLevel').value)||120);
      cv.cvtColor(s,o,cv.COLOR_GRAY2RGBA);s.delete();
    }
    else if(filter==='form'){
      const s=formFilter(m,Number($('scanLevel').value)||120,Number($('formFade').value)/100,Number($('formEmph').value)/100);
      cv.cvtColor(s,o,cv.COLOR_GRAY2RGBA);s.delete();
    }
    else if(filter==='gray'){cv.cvtColor(m,g,cv.COLOR_RGBA2GRAY);cv.cvtColor(g,o,cv.COLOR_GRAY2RGBA);}
    else {
      cv.cvtColor(m,g,cv.COLOR_RGBA2GRAY);
      cv.medianBlur(g,g,3);
      const smallest=Math.min(g.cols,g.rows);
      const blockSize=Math.min(41,smallest%2===0?smallest-1:smallest);
      if(blockSize>=3)cv.adaptiveThreshold(g,g,255,cv.ADAPTIVE_THRESH_GAUSSIAN_C,cv.THRESH_BINARY,blockSize,8);
      else cv.threshold(g,g,0,255,cv.THRESH_BINARY+cv.THRESH_OTSU);
      cv.cvtColor(g,o,cv.COLOR_GRAY2RGBA);
    }
    const tmp=document.createElement('canvas');cv.imshow(tmp,o);
    const out=$('out'),swap=rot%2===1;
    out.width=swap?tmp.height:tmp.width;out.height=swap?tmp.width:tmp.height;
    const x=out.getContext('2d');x.translate(out.width/2,out.height/2);x.rotate(rot*Math.PI/2);x.drawImage(tmp,-tmp.width/2,-tmp.height/2);
  } catch(error) {
    status('濾鏡處理失敗，請重新載入圖片。',true);
  } finally {
    if(channels){for(let i=0;i<channels.size();i++)channels.get(i).delete();channels.delete();}
    [m,o,g,hsv,rgb].forEach(value=>{if(value)value.delete();});
  }
}

function downloadCanvas(canvas,name,type='image/jpeg',onDownloaded) {
  canvas.toBlob(blob=>{
    if(!blob){status('無法產生下載檔案。',true);return;}
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);
    if(onDownloaded)onDownloaded();
  },type,.92);
}

function updatePages() {
  const holder=$('pages');holder.replaceChildren();
  pages.forEach((page,index)=>{
    const card=document.createElement('div');card.className='page-card';
    const thumb=document.createElement('canvas');thumb.width=page.width;thumb.height=page.height;
    thumb.getContext('2d').drawImage(page,0,0);
    const no=document.createElement('span');no.className='page-no';no.textContent=String(index+1);
    card.append(thumb,no);holder.append(card);
  });
  $('savePdf').disabled=pages.length===0;$('clearPages').disabled=pages.length===0;
  $('savePdf').textContent=`匯出 PDF（${pages.length} 頁）`;
}
$('btnAddPage').addEventListener('click',()=>{
  const page=document.createElement('canvas');page.width=$('out').width;page.height=$('out').height;
  page.getContext('2d').drawImage($('out'),0,0);pages.push(page);updatePages();
  returnToPicker(`已加入 PDF 第 ${pages.length} 頁，可繼續拍攝或匯出 PDF。`);
});
$('clearPages').addEventListener('click',()=>{
  if(!pages.length)return;
  if(!confirm('確定清除目前文件的所有頁面？'))return;
  pages=[];updatePages();status('文件頁面已清除。');
});

async function exportPdf() {
  if(!pages.length)return;
  $('savePdf').disabled=true;status('正在建立 PDF…');
  try {
    const jpegBytes=await Promise.all(pages.map(page=>new Promise((resolve,reject)=>{
      page.toBlob(blob=>blob?blob.arrayBuffer().then(buffer=>resolve(new Uint8Array(buffer)),reject):reject(new Error('頁面影像編碼失敗。')),'image/jpeg',.92);
    })));
    const objects=[];
    objects[1]=ascii('<< /Type /Catalog /Pages 2 0 R >>');
    const kids=[];
    pages.forEach((page,index)=>{
      const pageId=3+index*3,imageId=pageId+1,contentId=pageId+2;
      kids.push(`${pageId} 0 R`);
      const scale=Math.min(595/page.width,842/page.height),w=(page.width*scale).toFixed(2),h=(page.height*scale).toFixed(2);
      objects[pageId]=ascii(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${w} ${h}] /Resources << /XObject << /Im0 ${imageId} 0 R >> >> /Contents ${contentId} 0 R >>`);
      objects[imageId]=join([ascii(`<< /Type /XObject /Subtype /Image /Width ${page.width} /Height ${page.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes[index].length} >>\nstream\n`),jpegBytes[index],ascii('\nendstream')]);
      const content=ascii(`q ${w} 0 0 ${h} 0 0 cm /Im0 Do Q`);
      objects[contentId]=join([ascii(`<< /Length ${content.length} >>\nstream\n`),content,ascii('\nendstream')]);
    });
    objects[2]=ascii(`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${kids.length} >>`);
    const chunks=[ascii('%PDF-1.4\n%scan\n')],offsets=[0];let length=chunks[0].length;
    for(let id=1;id<objects.length;id++){
      offsets[id]=length;const entry=join([ascii(`${id} 0 obj\n`),objects[id],ascii('\nendobj\n')]);chunks.push(entry);length+=entry.length;
    }
    const xrefOffset=length;
    let xref=`xref\n0 ${objects.length}\n0000000000 65535 f \n`;
    for(let id=1;id<objects.length;id++)xref+=`${String(offsets[id]).padStart(10,'0')} 00000 n \n`;
    xref+=`trailer\n<< /Size ${objects.length} /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`;
    chunks.push(ascii(xref));
    const blob=new Blob(chunks,{type:'application/pdf'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=`document_${Date.now()}.pdf`;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);
    status(`PDF 已建立，共 ${pages.length} 頁。`);
  } catch(error) {
    status(error.message||'PDF 匯出失敗，請再試一次。',true);
  } finally {
    $('savePdf').disabled=pages.length===0;
    $('savePdf').textContent=`匯出 PDF（${pages.length} 頁）`;
  }
}
function ascii(text){return new TextEncoder().encode(text);}
function join(parts){const output=new Uint8Array(parts.reduce((sum,part)=>sum+part.length,0));let at=0;parts.forEach(part=>{output.set(part,at);at+=part.length;});return output;}
$('savePdf').addEventListener('click',exportPdf);
updatePages();

let installPrompt=null;
addEventListener('beforeinstallprompt',event=>{
  event.preventDefault();installPrompt=event;$('install').classList.remove('hide');
});
$('install').addEventListener('click',async()=>{
  if(!installPrompt)return;
  installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('install').classList.add('hide');
});
addEventListener('appinstalled',()=>{$('install').classList.add('hide');status('文件掃描已安裝。');});
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>status('離線快取初始化失敗；掃描功能仍可在線使用。',true)));
}
